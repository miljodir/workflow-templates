name: Reusable module test checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/terraform-test.yaml
      - .github/workflows/terraform-test-checks.yaml
      - tests/terraform-test/**
  push:
    branches: [main]
    paths:
      - .github/workflows/terraform-test.yaml
      - .github/workflows/terraform-test-checks.yaml
      - tests/terraform-test/**

permissions:
  contents: read

jobs:
  plain:
    uses: ./.github/workflows/terraform-test.yaml
    with:
      working-directory: tests/terraform-test/plain
      terraform-version: "1.7.0"
      opentofu-version: "1.13.9"
  fixtures:
    uses: ./.github/workflows/terraform-test.yaml
    with:
      working-directory: tests/terraform-test/prepared
      test-directory: checks
      prepare-script: prepare.sh
      test-override-directory: checks/overrides
      opentofu-version: "1.13.9"
  json:
    uses: ./.github/workflows/terraform-test.yaml
    with:
      working-directory: tests/terraform-test/json
      terraform-version: "1.7.0"
      opentofu-version: "1.13.9"
  tofu-only:
    uses: ./.github/workflows/terraform-test.yaml
    with:
      engine: opentofu
      working-directory: tests/terraform-test/tofu-only
      opentofu-version: "1.13.9"
  sensitive-output:
    uses: ./.github/workflows/terraform-test.yaml
    with:
      working-directory: tests/terraform-test/sensitive-output
      test-override-directory: tests/overrides
      opentofu-version: "1.13.9"
