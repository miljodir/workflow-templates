name: Create and update git tag for updated workflows
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/statuscheck-terraform-module-tag.yaml

jobs:
  pr:
    if: ${{ true }}   # GitHub's documented fix for running outside the source
    uses: ./.github/workflows/generate-release-metadata.yaml
    permissions:
      pull-requests: write
      contents: write
    with:
      rootFolder: /
      type: terraform
      index-split: 0
      wiki-enabled: true
      exclude-files: '["tests/**"]'