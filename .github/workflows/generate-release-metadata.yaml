name: Generate release metadata
concurrency:
  # Merge runs get their own group and are never cancelled, so a release is never lost
  group: ${{ github.repository }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_call:
    inputs:
      rootFolder:
        type: string
        description: "Folder location relative to root of repository to create release tags for"
        required: false
        default: "modules"
      type:
        type: string
        description: "'actions' or 'terraform'"
        required: false
        default: "terraform"
      index-split:
        type: number
        description: "'1' for reporoot/folder1, '2' for reporoot/folder1/subfolder1"
        required: false
        default: 1
      wiki-enabled:
        type: string
        description: "Write Terraform docs to wiki or not"
        required: false
        default: "false"

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    name: "Detect pull request context"
    outputs:
      directories: ${{ steps.condense.outputs.result }}
      release-type: ${{ steps.check_pr_label.outputs.release-type}}
      changelog: ${{ steps.changelog.outputs.result }}
      is-merge-event: >-
        ${{ github.event_name == 'pull_request_target'
         && github.event.action == 'closed'
         && github.event.pull_request.merged == true }}
    steps:
      - name: Check PR labels
        id: check_pr_label
        env:
          # Fetched from the API (not the event payload) so re-running the job picks up label changes
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh pr view "$PR_URL" --json labels --jq '.labels[]| select((.name=="minor") or (.name=="major") or (.name=="patch") or (.name=="no-release")) |.name')
          NUMBER_OF_LABELS=$(echo "$LABELS" |wc -w)
          if [ "$NUMBER_OF_LABELS" -eq "1" ] ; then
            echo "Found: $LABELS"
            echo "release-type=$LABELS" >> "$GITHUB_OUTPUT"
          elif [ "$NUMBER_OF_LABELS" -gt "1" ] ; then
            echo "::error title=Too many release labels::Found $( echo $LABELS | tr '\n' ' ')- keep exactly one of patch/minor/major/no-release on the pull request."
            exit 1
          else
            echo "::error title=Missing release label::Add exactly one of the labels patch/minor/major/no-release to the pull request."
            exit 2
          fi
      - name: Get changed files
        uses: Ana06/get-changed-files@25f79e676e7ea1868813e21465014798211fad8c # v2.3.0
        id: raw-files
        with:
          format: "json"
      - name: Condense to directory list
        uses: actions/github-script@v9
        id: condense
        env:
          RAW_FILES: "${{ steps.raw-files.outputs.all }}"
        with:
          script: |
            const raw = JSON.parse(process.env.RAW_FILES);
            let directories = Array.from(new Set(raw
              .filter(x => x.startsWith('${{ inputs.rootFolder }}'))
              .filter(x => x.includes('/'))
              .map(x => x.split('/')[${{ inputs.index-split }}])
              .map(x => x.split('.')[0])
            ));
            if (directories.length < 1 && ${{ inputs.rootFolder == '/' }})
            {
              directories = Array.from(new Set(raw
              .filter(x => x.includes('.tf'))
              .filter(x => !x.startsWith('.'))
              .filter(x => !x.includes('modules'))
              .filter(x => !x.includes('examples'))
              .map(x => x.substr(0, x.lastIndexOf('/')))
            ));
            }
            if (directories.length < 1) return {};
            return {
              include: directories.map(directory => ({ directory })),
            };

      # Validated once here (instead of per module) so a missing changelog fails fast
      - name: Extract changelog entry
        id: changelog
        if: ${{ steps.condense.outputs.result != '{}' && steps.check_pr_label.outputs.release-type != 'no-release' }}
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const { data: prInfo } = await github.rest.pulls.get({
              owner, repo,
              pull_number: context.issue.number,
            });

            const changelogEntry = (((prInfo.body || '')
              .split(/^#+ ?/m)
              .find(x => x.startsWith('Changelog'))
              || '').split(/^```/m)[1] || '').trim();
            if (!changelogEntry)
              core.setFailed(`'## Changelog entry' section with a \`\`\` code block was not found in the PR description. Please add it back and save the description.`);
            else if (changelogEntry.match(/^TODO:/m))
              core.setFailed(`'Changelog entry' in the PR description still contains the 'TODO' placeholder. Replace it with a useful message and save the description.`);
            else
              console.log('Found changelog entry:\n' + changelogEntry);
            return changelogEntry;

  plan:
    needs: detect
    if: ${{ needs.detect.outputs.directories != '{}' && needs.detect.outputs.release-type != 'no-release' }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.directories) }}
      fail-fast: false
    outputs:
      job-total: ${{ strategy.job-total }}
      name: "${{ matrix.directory || 'main' }}"
    name: "Module: ${{ matrix.directory }}"
    env:
      # Terraform docs are only consumed by the wiki update after merge, so skip them on PR runs
      RENDER_WIKI_DOCS: ${{ inputs.wiki-enabled == 'true' && inputs.type == 'terraform' && needs.detect.outputs.is-merge-event == 'true' }}
    steps:
      - name: Detect previous version number
        uses: actions/github-script@v9
        id: prev-version
        env:
          PACKAGE_NAME: "${{ matrix.directory || 'main' }}"
        with:
          script: |
            const { owner, repo } = context.repo;
            const query = `query($owner: String!, $repo: String!, $refPrefix: String!, $first: Int!) {
              repository(owner: $owner, name: $repo) {
                refs(refPrefix: $refPrefix, first: $first, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {
                  edges { node { name } }
                }
              }
            }`;

            let refPrefix = `refs/tags/${process.env.PACKAGE_NAME}/`;
            if (process.env.PACKAGE_NAME == 'main')
            {
              refPrefix = 'refs/tags/';
            }
            console.log('Querying for previous version', refPrefix);

            const result = await github.graphql(query, { owner, repo,
              refPrefix: refPrefix,
              first: 100,
            });

            // Ignore floating major tags (e.g. 'v1') and other non-semver tags, then pick the highest version
            const semver = /^\d+\.\d+\.\d+$/;
            const versions = result.repository.refs.edges
              .map(edge => edge.node.name)
              .filter(name => semver.test(name))
              .sort((a, b) => {
                const [x, y] = [a, b].map(v => v.split('.').map(Number));
                return (y[0] - x[0]) || (y[1] - x[1]) || (y[2] - x[2]);
              });
            const prevVer = versions[0] || '0.0.0';
            console.log('Found previous version', prevVer);
            return prevVer;
          result-encoding: string

      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'pull_request' && inputs.type == 'actions' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Auto documentation for ${{ matrix.directory }} reusable workflow
        uses: tj-actions/auto-doc@b10ceedffd794ec29a8fa8700529f40c1b64a951 # v3
        if: ${{ github.event_name == 'pull_request' && inputs.type == 'actions' }}
        continue-on-error: true
        with:
          reusable: true
          output: doc/workflows/${{ matrix.directory }}.md
          filename: .github/workflows/${{ matrix.directory }}.yaml

      - name: Update documentation
        if: ${{ github.event_name == 'pull_request' && inputs.type == 'actions' }}
        continue-on-error: true
        env:
          ref: ${{ github.head_ref }}
          DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config pull.rebase false
          git checkout "$ref"
          git pull origin "$ref"
          git add "*${DIRECTORY}.md"
          git commit -m "${DIRECTORY}: Update documentation for workflow [skip ci]" || echo "No changes detected"
          git push

      - name: Determine new version number
        uses: actions/github-script@v9
        id: new-version
        env:
          PREV_VERSION: "${{ steps.prev-version.outputs.result }}"
          RELEASE_TYPE: "${{ needs.detect.outputs.release-type }}"
        with:
          script: |
            const { PREV_VERSION, RELEASE_TYPE } = process.env;
            console.log('Previous version was', PREV_VERSION);
            console.log('Release type is', RELEASE_TYPE);

            const numbers = PREV_VERSION.split('.');
            const numberIdx = ['major', 'minor', 'patch'].indexOf(RELEASE_TYPE);
            numbers[numberIdx] = parseInt(numbers[numberIdx]) + 1;
            for (let i = numberIdx + 1; i < numbers.length; i++) {
              numbers[i] = 0;
            }
            return numbers.join('.');
          result-encoding: string

      - name: Store version numbers and changelog
        env:
          PREV_VERSION: ${{ steps.prev-version.outputs.result }}
          NEW_VERSION: ${{ steps.new-version.outputs.result }}
          CHANGELOG: ${{ needs.detect.outputs.changelog }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          mkdir output
          echo "$PREV_VERSION" > output/previous-version.txt
          echo "$NEW_VERSION" > output/new-version.txt
          printf '* PR [#%s](%s) - %s\n\n```\n%s\n```\n' "$PR_NUMBER" "$PR_URL" "$PR_TITLE" "$CHANGELOG" > output/changelog.md

      - name: Document example 'source' line
        if: ${{ env.RENDER_WIKI_DOCS == 'true' && inputs.rootFolder != '/' }}
        run: |
          cat > output/documentation.md <<'EOF'
          # Module Location
          To use this module in your Terraform, use the below source value.

          ```hcl
          module "${{ matrix.directory }}" {
            source = "git@github.com:${{ github.repository }}//${{ inputs.rootFolder }}/${{ matrix.directory }}?ref=${{ matrix.directory }}/${{ steps.new-version.outputs.result }}"

            # also any inputs for the module (see below)
          }
          ```

          EOF

      - name: Document example 'source' line
        if: ${{ env.RENDER_WIKI_DOCS == 'true' && inputs.rootFolder == '/' }}
        run: |
          cat > output/documentation.md <<'EOF'
          # Module Location
          To use this module in your Terraform, use the below source value.

          ```hcl
          module "main" {
            source = "git@github.com:${{ github.repository }}?ref=${{ steps.new-version.outputs.result }}"

            # also any inputs for the module (see below)
          }
          ```

          EOF

      - name: Install terraform docs
        if: ${{ env.RENDER_WIKI_DOCS == 'true' }}
        env:
          TERRAFORM_DOCS_VERSION: v0.20.0
        run: |
          wget "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            --output-document - \
            --progress dot:mega \
          | tar -xz

      - name: Clone repository for analysis
        if: ${{ env.RENDER_WIKI_DOCS == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: src
          persist-credentials: false

      - name: Render terraform docs
        if: ${{ env.RENDER_WIKI_DOCS == 'true' }}
        env:
          MODULE_PATH: src/${{ inputs.rootFolder }}/${{ matrix.directory }}
        run: |
          echo '# Module Attributes' >> output/documentation.md
          ./terraform-docs markdown table \
            --output-file "$(pwd)"/output/documentation.md \
            --sort-by required \
            "$MODULE_PATH"

      - name: Upload result artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.directory || 'main' }}"
          path: output
          retention-days: 5

  comment:
    needs: [detect, plan]
    # Also runs when 'plan' is skipped (no-release / no changed modules) so a stale release plan is replaced
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.detect.outputs.is-merge-event == 'false'
      && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    name: "Comment on PR"
    steps:
      - name: Download artifact(s)
        if: needs.plan.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: ${{needs.plan.outputs.job-total == 1 && format('outputs/{0}', needs.plan.outputs.name) || 'outputs' }} 
      - uses: actions/github-script@v9
        env:
          RELEASE_TYPE: ${{ needs.detect.outputs.release-type }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number: issue_number } = context.issue;
            const { readdir, readFile } = require('fs').promises;
            const { existsSync } = require('fs');
            const utf8 = { encoding: 'utf-8' };

            const lines = [
              '# Release plan', '',
              'Tags for major versions, e.g. "mymodule/v1" are automatically updated to latest version, but are not listed below', '',
              '| Module | Previous version | New version |',
              '|--|--|--|',
            ];
            const sections = [];

            const folders = existsSync('outputs')
              ? (await readdir('outputs', { withFileTypes: true })).filter(x => x.isDirectory())
              : [];
            for (const folder of folders) {
              const readText = (name) => readFile(name, utf8).then(x => x.trim());

              lines.push('| '+[
                `\`${folder.name}\``,
                `${await readText(`outputs/${folder.name}/previous-version.txt`)}`,
                `**${await readText(`outputs/${folder.name}/new-version.txt`)}**`,
              ].join(' | ')+' |');

              sections.push(`<details><summary>Changelog preview: ${folder.name}</summary>\n\n${await readText(`outputs/${folder.name}/changelog.md`)}\n</details>`);
            }

            if (folders.length === 0) {
              const reason = process.env.RELEASE_TYPE === 'no-release'
                ? 'the pull request is labeled `no-release`'
                : 'no releasable modules were changed';
              lines.splice(2);
              lines.push(`No release will be created when this pull request is merged, because ${reason}.`);
            }

            const finalBody = [lines.join('\n'), ...sections].join('\n\n');

            const allComments = await github.paginate(github.rest.issues.listComments, { issue_number, owner, repo, per_page: 100 });
            const ourComments = allComments
              .filter(comment => comment.user.login === 'github-actions[bot]')
              .filter(comment => comment.body.startsWith(lines[0]+'\n'));

            // Update the oldest existing release plan comment in place to avoid notification noise
            const [existingComment, ...duplicateComments] = ourComments;
            if (!existingComment) {
              const {data: newComment} = await github.rest.issues.createComment({ issue_number, owner, repo, body: finalBody });
              console.log('Posted comment', newComment.id, '@', newComment.html_url);
            } else if (existingComment.body === finalBody) {
              console.log('Existing comment is already up to date.');
            } else {
              await github.rest.issues.updateComment({ comment_id: existingComment.id, owner, repo, body: finalBody });
              console.log('Updated comment', existingComment.id, '@', existingComment.html_url);
            }

            // Clean up duplicates left behind by the previous delete-and-repost behaviour
            for (const comment of duplicateComments) {
              console.log('Deleting duplicate PR comment from', comment.created_at);
              await github.rest.issues.deleteComment({ comment_id: comment.id, owner, repo });
            }

  trigger-release:
    needs: [detect, plan]
    if: needs.detect.outputs.is-merge-event == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: "Dispatch release event"
    steps:
      - uses: actions/download-artifact@v8
        name: Download artifact(s)
        with:
          path: ${{needs.plan.outputs.job-total == 1 && format('outputs/{0}', needs.plan.outputs.name) || 'outputs' }} 

      - name: Combine version information
        id: extract-releases
        uses: actions/github-script@v9
        with:
          script: |
            const { readdir, readFile } = require('fs').promises;
            const utf8 = { encoding: 'utf-8' };
            const readText = (name) => readFile(name, utf8).then(x => x.trim());

            const directories = await readdir('outputs', { withFileTypes: true });
            return await Promise.all(directories
              .filter(x => x.isDirectory())
              .map(async folder => ({
                module: folder.name,
                prevVersion: await readText(`outputs/${folder.name}/previous-version.txt`),
                newVersion: await readText(`outputs/${folder.name}/new-version.txt`),
              })));

      - name: Dispatch release events
        uses: actions/github-script@v9
        env:
          RELEASE_LIST: "${{ steps.extract-releases.outputs.result }}"
          WIKI_ENABLED: ${{ inputs.wiki-enabled }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const payload = {
              run_id: context.runId.toString(),
              sha: context.sha,
              releases: JSON.parse(process.env.RELEASE_LIST),
            };
            console.log('Event payload:', JSON.stringify(payload, null, 2));

            const eventTypes = ['create_release'];
            if (process.env.WIKI_ENABLED === 'true') eventTypes.push('update_wiki');

            const { owner, repo } = context.repo;
            for (const event_type of eventTypes) {
              console.log('Dispatching', event_type);
              await github.rest.repos.createDispatchEvent({ owner, repo, event_type, client_payload: payload });
            }

            await core.summary
              .addHeading('Dispatched release events')
              .addList(eventTypes)
              .addTable([
                [{ data: 'Module', header: true }, { data: 'Previous version', header: true }, { data: 'New version', header: true }],
                ...payload.releases.map(r => [r.module, r.prevVersion, r.newVersion]),
              ])
              .write();
