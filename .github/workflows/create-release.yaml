name: "Create release"
on:
  workflow_call:
    inputs:
      payload:
        description: "Input metadata for the release"
        required: true
        type: string
jobs:
  tag:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: "Tag Releases"
    steps:
      - uses: actions/github-script@v9
        env:
          CLIENT_PAYLOAD: ${{ inputs.payload }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { owner, repo } = context.repo;
            const { sha, releases } = JSON.parse(process.env.CLIENT_PAYLOAD);
            const rows = [];

            // Creating is idempotent so a failed run can be safely re-run
            const createTag = async (tagName) => {
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tagName}`, sha });
              } catch (error) {
                if (error.status !== 422) throw error;
                const { data: existing } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` });
                if (existing.object.sha !== sha) throw new Error(`Tag ${tagName} already exists on ${existing.object.sha}, expected ${sha}`);
                console.log('Tag', tagName, 'already exists on', sha);
              }
            };

            for (const { module, newVersion } of releases) {
              const prefix = module === 'main' ? '' : `${module}/`;
              const tagName = `${prefix}${newVersion}`;
              const majorTagName = `${prefix}v${newVersion.split('.')[0]}`;

              console.log('Tagging', tagName, 'as', sha);
              await createTag(tagName);

              try {
                console.log('Updating existing tag', majorTagName, 'as', sha);
                await github.rest.git.updateRef({ owner, repo, ref: `tags/${majorTagName}`, sha, force: true });
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) throw error;
                console.log('Creating new tag', majorTagName, 'as', sha);
                await createTag(majorTagName);
              }

              rows.push([module, tagName, majorTagName]);
            }

            await core.summary
              .addHeading('Created releases')
              .addRaw(`Commit: ${sha}`, true)
              .addTable([
                [{ data: 'Module', header: true }, { data: 'Tag', header: true }, { data: 'Major tag', header: true }],
                ...rows,
              ])
              .write();
