name: Create and update git tag for updated workflows
on:
  workflow_dispatch:

permissions: {}

jobs:
  pr:
    if: ${{ true }}   # GitHub's documented fix for running outside the source
    uses: ./.github/workflows/generate-release-metadata.yaml
    permissions:
      pull-requests: write
      contents: write
    with:
      rootFolder: .github/workflows
      type: actions
      index-split: 2 # .github/workflows = index 2
      wiki-enabled: false